[preset.0]
name="Android Debug"
platform="Android"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="smoke.gd,README.md"
export_path="build/janggi-debug.apk"

[preset.0.options]
custom_template/debug="../.local/android-templates/android_debug.apk"
custom_template/release="../.local/android-templates/android_release.apk"
gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
